# Archiva la lluvia de las estaciones del INAMHI (cada 3 h: su API solo guarda
# 12 h) y cruza cada inundación de la SNGR con la lluvia (satélite, pronóstico y
# estación) y el caudal de ese lugar y ese día. Ver README.md.
name: Cruzar inundaciones de la SNGR

on:
  schedule:
    # Estaciones del INAMHI: cada 3 horas.
    - cron: "20 */3 * * *"
    # Cruce de inundaciones: 09:00 de Ecuador, cuando ya se publicó la lluvia del día anterior.
    - cron: "0 14 * * *"
  # Botón "Run workflow": hace las dos cosas; también sirve para bajar el histórico (con "desde").
  workflow_dispatch:
    inputs:
      desde:
        description: "Desde (AAAA-MM-DD). Vacío = últimos 30 días"
        required: false
      hasta:
        description: "Hasta (AAAA-MM-DD). Vacío = hoy"
        required: false
      max_eventos:
        description: "Tope de eventos a procesar en esta ejecución"
        required: false
        default: "1500"

permissions:
  contents: write

jobs:
  estaciones:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 */3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Una a la vez; no espera al cruce (que puede tardar horas): si no, se perderían horas de la API.
    concurrency:
      group: estaciones
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archivar la lluvia de las estaciones
        run: python estaciones.py

      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estaciones
          git diff --cached --quiet && exit 0
          git commit -m "Estaciones: lluvia hasta el $(date -u +'%F %H:%M') UTC"
          # Otro workflow pudo guardar entre medio: se reintenta sobre lo último.
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((intento * 10))
          done
          exit 1

  cruzar:
    needs: estaciones
    # Corre aunque el job de estaciones se haya saltado (ejecución de las 14:00) o haya fallado.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '0 14 * * *') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Comparte el grupo con el archivado de lluvia: nunca dos a la vez.
    concurrency:
      group: archivar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Lo último de la rama, con las horas de las estaciones recién guardadas.
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cruzar eventos con lluvia y caudal
        env:
          SNGR_USUARIO: ${{ secrets.SNGR_USUARIO }}
          SNGR_CLAVE: ${{ secrets.SNGR_CLAVE }}
          DESDE: ${{ inputs.desde }}
          HASTA: ${{ inputs.hasta }}
          MAX: ${{ inputs.max_eventos || '1500' }}
        run: |
          args=(--max-eventos "$MAX")
          [ -n "$DESDE" ] && args+=(--desde "$DESDE")
          [ -n "$HASTA" ] && args+=(--hasta "$HASTA")
          python cruzar_eventos.py "${args[@]}"

      # Aunque se corte a medias, se guarda lo avanzado (la siguiente ejecución sigue).
      - name: Guardar los eventos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos
          git diff --cached --quiet && exit 0
          git commit -m "Eventos: cruce del $(date -u +%F)"
          for intento in 1 2 3 4 5; do
            git pull --rebase --autostash && git push && exit 0
            sleep $((intento * 10))
          done
          exit 1
